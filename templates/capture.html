<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chụp Ảnh Trả Hàng Tự Động</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .header {
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 30;
        }
        .header-title { font-size: 15px; font-weight: 700; color: #38bdf8; }
        .progress-dots { display: flex; gap: 8px; }
        .pdot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #334155;
            transition: all 0.3s;
        }
        .pdot.done { background: #22c55e; }
        .pdot.current { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; transform: scale(1.1); }

        /* Camera Viewport */
        .camera-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Target Framing Box (Khung canh bình) */
        .target-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 74%;
            height: 70%;
            border: 2px dashed rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            pointer-events: none;
            z-index: 12;
            transition: border-color 0.25s, box-shadow 0.25s, transform 0.15s ease-out;
        }
        .target-box.aligning {
            border-color: #facc15;
            border-style: solid;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
        }
        .target-box.locked {
            border-color: #22c55e;
            border-style: solid;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.6);
        }
        .target-box.error {
            border-color: #ef4444;
            border-style: solid;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
        }

        /* Ghost Image Overlay */
        #ghost-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70%; height: 66%;
            object-fit: contain;
            opacity: 0.40;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.2s;
        }

        /* Hidden processing canvas */
        #proc-canvas, #thumb-canvas { display: none; }

        /* Controls & Guide Bar */
        .guide-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 16px 20px 24px 20px;
            background: linear-gradient(transparent, rgba(15, 23, 42, 0.95) 40%, rgba(15, 23, 42, 1));
            z-index: 20;
            text-align: center;
        }
        #guide-text {
            font-size: 16px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            min-height: 24px;
            margin-bottom: 8px;
        }

        /* Progress Bar (Hidden in manual mode) */
        .timer-wrap {
            display: none;
        }

        /* Actions: Manual snap button */
        .bottom-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }
        .snap-btn {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            border: 3px solid #ffffff;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(14, 165, 233, 0.45);
            transition: all 0.2s;
        }
        .snap-btn:active {
            background: #0369a1;
            transform: scale(0.95);
        }

        /* Opacity control pill */
        .opacity-pill {
            position: absolute;
            top: 14px; right: 14px;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 12px;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .opacity-pill input {
            width: 60px;
            accent-color: #38bdf8;
        }

        /* Flash effect */
        .flash {
            position: absolute;
            inset: 0;
            background: #fff;
            z-index: 35;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
        }
        .flash.active { opacity: 0.9; transition: none; }

        /* Transition screen between views */
        #transition-screen {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.92);
            z-index: 40;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            padding: 20px;
        }
        #transition-screen.show { display: flex; }
        .trans-check { font-size: 56px; }
        .trans-done { font-size: 20px; font-weight: 700; color: #22c55e; }
        .trans-next { font-size: 17px; color: #94a3b8; line-height: 1.4; }
        .trans-countdown { font-size: 38px; font-weight: 800; color: #38bdf8; margin-top: 6px; }

        /* All done screen */
        #done-screen {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            z-index: 50;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            padding: 20px;
        }
        #done-screen.show { display: flex; }
        .done-icon { font-size: 64px; }
        .done-text { font-size: 22px; font-weight: 700; color: #22c55e; }
        .done-sub { font-size: 15px; color: #94a3b8; max-width: 300px; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <span class="header-title" id="view-title">Mặt Trước</span>
        <div class="progress-dots" id="progress-dots"></div>
    </div>

    <!-- Camera Viewport -->
    <div class="camera-area">
        <video id="video" autoplay playsinline muted></video>
        <img id="ghost-overlay" alt="" crossorigin="anonymous">
        <canvas id="proc-canvas"></canvas>
        <canvas id="thumb-canvas" width="32" height="32"></canvas>

        <!-- Khung căn chỉnh bình -->
        <div class="target-box" id="target-box"></div>

        <!-- Chỉnh độ mờ bóng mờ -->
        <div class="opacity-pill">
            <span>Bóng mờ:</span>
            <input type="range" id="opacity-slider" min="15" max="85" value="40" oninput="setGhostOpacity(this.value)">
        </div>

        <div class="flash" id="flash"></div>

        <!-- Hướng dẫn & Đếm ngược -->
        <div class="guide-bar">
            <div id="guide-text">Đang khởi động camera...</div>
            <div class="timer-wrap">
                <div id="timer-bar"></div>
            </div>
            <div class="bottom-actions">
                <button class="snap-btn" id="manual-btn" onclick="triggerManualCapture()">
                    📸 Bấm Chụp Ngay
                </button>
            </div>
        </div>

        <!-- Màn hình chuyển đổi giữa các góc -->
        <div id="transition-screen">
            <div class="trans-check">✅</div>
            <div class="trans-done" id="trans-done-text"></div>
            <div class="trans-next" id="trans-next-text"></div>
            <div class="trans-countdown" id="trans-countdown">3</div>
        </div>

        <!-- Màn hình hoàn tất -->
        <div id="done-screen">
            <div class="done-icon">🎉</div>
            <div class="done-text">Đã Chụp Đủ 4 Góc!</div>
            <div class="done-sub">Ảnh đã được gửi lên hệ thống phân tích. Bạn có thể đóng tab này và xem kết quả trên máy tính.</div>
            <div id="done-return-tag" style="display:none; font-size:13px; color:#38bdf8; background:#1e293b; padding:6px 14px; border-radius:20px; border:1px solid #0284c7;"></div>
        </div>
    </div>

<script>
// ── Server Variables ────────────────────────────────────────────────────────
const SESSION_ID = "{{ session_id }}";
const PRODUCT_ID = "{{ product_id }}";
const RETURN_ID = {{ return_id | tojson if return_id is defined and return_id is not none else 'null' }};
const CLOUDINARY_CLOUD_NAME = "{{ cloudinary_cloud_name or '' }}";
const VIEW_CLOUDINARY_MAP = {
    "truoc": "front",
    "sau": "back",
    "trai": "left",
    "phai": "right"
};
window.RETURN_ID = RETURN_ID;
window.SESSION_ID = SESSION_ID;
window.PRODUCT_ID = PRODUCT_ID;
const VIEWS = {{ views | tojson }};
const VIEW_LABELS = {{ view_labels | tojson }};
const CFG = {{ config | tojson }};
const GHOST_AVAILABLE = {{ ghost_available | tojson }};
const MIN_MATCH_THRESHOLD = (CFG.min_match_threshold !== undefined) ? CFG.min_match_threshold : 0.35;

// Thời gian giữ yên bắt buộc trước khi tự chụp (7.0 giây)
const STABLE_DURATION_MS = (CFG.stable_duration_sec || 7.0) * 1000;

// ── DOM Elements ────────────────────────────────────────────────────────────
const video = document.getElementById('video');
const ghost = document.getElementById('ghost-overlay');
const targetBox = document.getElementById('target-box');
const guideText = document.getElementById('guide-text');
const timerBar = document.getElementById('timer-bar');
const flash = document.getElementById('flash');
const viewTitle = document.getElementById('view-title');
const progressDots = document.getElementById('progress-dots');
const transScreen = document.getElementById('transition-screen');
const doneScreen = document.getElementById('done-screen');
const procCanvas = document.getElementById('proc-canvas');
const thumbCanvas = document.getElementById('thumb-canvas');

// Canvas tính độ tương đồng với bóng mờ ảnh mẫu & Auto-Snap Buffer (+-12px)
const G_SZ = 64;             // Kích thước Ghost Template chuẩn
const B_SZ = 88;             // Kích thước Buffer mở rộng cho Auto-Snap
const MAX_SNAP_OFFSET = 12;  // Biên tìm kiếm tối đa (+-12px trên lưới, ~20% khung hình)

const ghostCanvas = document.createElement('canvas');
ghostCanvas.width = G_SZ;
ghostCanvas.height = G_SZ;

const compCanvas = document.createElement('canvas');
compCanvas.width = B_SZ;
compCanvas.height = B_SZ;

// Canvas tính độ nét quang học trực tiếp vùng trung tâm (240x240)
const sharpCanvas = document.createElement('canvas');
sharpCanvas.width = 240;
sharpCanvas.height = 240;

let ghostTemplate = null;
let currentSnapDx = 0;
let currentSnapDy = 0;

// ── State ───────────────────────────────────────────────────────────────────
let currentViewIdx = 0;
let steadyProgress = 0;      // 0.0 -> 1.0
let lastTimestamp = 0;
let prevGray = null;
let frameBuffer = [];
let capturedThumbs = [];
let isUploading = false;
let animFrame = null;

// ── Peak Hunter (Săn khung hình Đỉnh: Nét nhất + Khớp nhất) ──
let bestPeakFrame = null;     // Khung hình đạt điểm cao nhất (Nét nhất & Khớp nhất)
let bestPeakScore = -1;       // Điểm đỉnh cao nhất ghi nhận được trong lúc giữ yên

const PROC_W = 160;
const PROC_H = 120;

// ── Initialize ──────────────────────────────────────────────────────────────

function initDots() {
    progressDots.innerHTML = '';
    VIEWS.forEach((v, i) => {
        const d = document.createElement('div');
        d.className = 'pdot' + (i === 0 ? ' current' : '');
        d.id = `dot-${i}`;
        progressDots.appendChild(d);
    });
}

function updateDots() {
    VIEWS.forEach((_, i) => {
        const d = document.getElementById(`dot-${i}`);
        if (!d) return;
        d.className = 'pdot';
        if (i < currentViewIdx) d.classList.add('done');
        if (i === currentViewIdx) d.classList.add('current');
    });
}

function loadGhost() {
    ghostTemplate = null;
    if (!GHOST_AVAILABLE) {
        ghost.style.display = 'none';
        return;
    }
    const view = VIEWS[currentViewIdx];
    const cloudSlot = VIEW_CLOUDINARY_MAP[view] || view;

    ghost.crossOrigin = 'anonymous';

    ghost.onload = () => {
        prepareGhostTemplate();
    };
    ghost.onerror = () => {
        // Nếu tải từ Cloudinary thất bại, thử fallback về server local
        if (ghost.src.includes('res.cloudinary.com')) {
            console.warn(`[Ghost] Không tải được từ Cloudinary, fallback về local: /ghost/${PRODUCT_ID}/${view}_nb.png`);
            ghost.src = `/ghost/${PRODUCT_ID}/${view}_nb.png?t=${Date.now()}`;
            return;
        }
        // Fallback sang mẫu mặc định '1' nếu PRODUCT_ID không tải được
        if (PRODUCT_ID !== '1' && !ghost.src.includes('/ghost/1/')) {
            console.warn(`[Ghost] Fallback sang mẫu chuẩn mặc định 1`);
            ghost.src = `/ghost/1/${view}_nb.png?t=${Date.now()}`;
            return;
        }
        ghost.style.display = 'none';
        ghostTemplate = null;
    };

    if (CLOUDINARY_CLOUD_NAME) {
        // Tải trực tiếp ảnh chuẩn bóng mờ từ Cloudinary CDN của hệ thống Ceramic Shop
        ghost.src = `https://res.cloudinary.com/${CLOUDINARY_CLOUD_NAME}/image/upload/ceramic_shop/products/${PRODUCT_ID}/preprocess/${cloudSlot}.png?t=${Date.now()}`;
    } else {
        ghost.src = `/ghost/${PRODUCT_ID}/${view}_nb.png?t=${Date.now()}`;
    }
    ghost.style.display = 'block';
}

function setGhostOpacity(val) {
    ghost.style.opacity = val / 100;
}

// ── Start Camera (iOS Safari HTTPS Checked) ─────────────────────────────────

async function startCamera() {
    try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("Trình duyệt Safari/iOS yêu cầu kết nối HTTPS bảo mật để mở camera. Vui lòng quét mã QR từ link HTTPS!");
        }

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: 'environment',
                width: { ideal: 1920, max: 4032 },
                height: { ideal: 1080, max: 3024 }
            }
        });

        video.srcObject = stream;
        await video.play();

        // Hỗ trợ chạm vào màn hình để kích hoạt lấy nét (Tap-to-Focus)
        video.addEventListener('click', async () => {
            try {
                const track = stream.getVideoTracks()[0];
                const caps = track.getCapabilities ? track.getCapabilities() : {};
                if (caps.focusMode && caps.focusMode.includes('continuous')) {
                    await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                }
            } catch (_) {}
        });

        procCanvas.width = PROC_W;
        procCanvas.height = PROC_H;
        lastTimestamp = performance.now();

        guideText.textContent = '📦 Đưa bình gốm vào giữa khung ngắm';
        requestAnimationFrame(loop);
    } catch (e) {
        guideText.textContent = '❌ ' + e.message;
        alert(e.message);
    }
}

// ── Main Processing Loop ────────────────────────────────────────────────────

function loop(timestamp) {
    if (!isUploading && video.readyState >= 2) {
        processFrame(timestamp || performance.now());
    }
    animFrame = requestAnimationFrame(loop);
}

function processFrame(now) {
    if (isUploading) return;

    if (!ghostTemplate) {
        setGuide('⏳ Đang tải ảnh bóng mờ mẫu sản phẩm...');
        targetBox.className = 'target-box';
        return;
    }

    const viewName = VIEW_LABELS[VIEWS[currentViewIdx]] || 'Mặt này';
    setGuide(`📦 Căn chỉnh bình khớp bóng mờ [${viewName}] rồi bấm "📸 Bấm Chụp Ngay"`);
    targetBox.className = 'target-box';
}

function decayProgress(dt, speed) {
    steadyProgress = 0;
}

function updateTimerBar(val) {
    // Tắt thanh tiến trình tự động
    if (timerBar) timerBar.style.width = '0%';
}

// ── Manual Trigger Capture ──────────────────────────────────────────────────

async function triggerManualCapture() {
    if (isUploading) return;
    if (!video || video.readyState < 2) {
        setGuide('⚠️ Camera đang khởi động, vui lòng chờ 1 giây...');
        return;
    }

    const manualBtn = document.getElementById('manual-btn');
    if (manualBtn) {
        manualBtn.disabled = true;
        manualBtn.style.opacity = '0.6';
    }

    isUploading = true;
    setGuide('📸 Đã chụp! Đang gửi lên máy chủ đối chiếu...');

    try {
        const live = captureCurrentVideoFrame();
        await processCapturedFrame(live.dataUrl);
    } catch (e) {
        console.error('Lỗi chụp ảnh:', e);
        setGuide('❌ Lỗi gửi ảnh: ' + e.message);
    } finally {
        isUploading = false;
        if (manualBtn) {
            manualBtn.disabled = false;
            manualBtn.style.opacity = '1';
        }
    }
}

function captureCurrentVideoFrame() {
    const capCanvas = document.createElement('canvas');
    capCanvas.width = video.videoWidth || 1280;
    capCanvas.height = video.videoHeight || 960;
    capCanvas.getContext('2d').drawImage(video, 0, 0);
    return { dataUrl: capCanvas.toDataURL('image/jpeg', 0.95), score: 1.0, quality: 1.0 };
}

async function processCapturedFrame(dataUrl) {
    // 1. Hiệu ứng chớp flash
    flash.classList.add('active');
    setTimeout(() => flash.classList.remove('active'), 180);

    // 2. Tải lên server và đối chiếu
    setGuide('⏳ Máy chủ đang đối chiếu hình dáng & đường nét bình gốm...');
    const ok = await uploadImage(dataUrl, VIEWS[currentViewIdx]);

    if (ok) {
        if (navigator.vibrate) try { navigator.vibrate(100); } catch(_) {}
        currentViewIdx++;
        updateDots();

        if (currentViewIdx >= VIEWS.length) {
            // Đã chụp đủ 4 góc!
            doneScreen.classList.add('show');
            cancelAnimationFrame(animFrame);
            if (video && video.srcObject) {
                try { video.srcObject.getTracks().forEach(t => t.stop()); } catch(_) {}
            }
            if (RETURN_ID) {
                const returnTag = document.getElementById('done-return-tag');
                if (returnTag) {
                    returnTag.textContent = `📋 Mã Phiếu Trả Hàng: #${RETURN_ID}`;
                    returnTag.style.display = 'inline-block';
                }
            }
        } else {
            // Hiển thị đếm ngược chuyển góc (3s) để khách xoay bình
            await showTransition();
            resetSteadyState();
            loadGhost();
            viewTitle.textContent = VIEW_LABELS[VIEWS[currentViewIdx]];
        }
    } else {
        if (navigator.vibrate) try { navigator.vibrate([120, 80, 120]); } catch(_) {}
        targetBox.className = 'target-box error';
        setGuide(`❌ ${lastUploadMessage || 'Không khớp sản phẩm mẫu! Vui lòng căn lại.'}`);
        await sleep(3500);
        targetBox.className = 'target-box';
    }
}

// ── Transition Screen ───────────────────────────────────────────────────────

function showTransition() {
    return new Promise(resolve => {
        const doneView = VIEW_LABELS[VIEWS[currentViewIdx - 1]];
        const nextView = VIEW_LABELS[VIEWS[currentViewIdx]];

        document.getElementById('trans-done-text').textContent = `Đã chụp ${doneView}!`;
        document.getElementById('trans-next-text').textContent = `Hãy xoay bình sang: ${nextView}`;

        transScreen.classList.add('show');

        let count = 3;
        const cdEl = document.getElementById('trans-countdown');
        cdEl.textContent = count;

        const timer = setInterval(() => {
            count--;
            if (count <= 0) {
                clearInterval(timer);
                transScreen.classList.remove('show');
                resolve();
            } else {
                cdEl.textContent = count;
            }
        }, 1000);
    });
}

// ── Upload ──────────────────────────────────────────────────────────────────

let lastUploadMessage = '';

async function uploadImage(dataUrl, view) {
    try {
        const blob = dataUrlToBlob(dataUrl);
        const form = new FormData();
        form.append('view', view);
        form.append('image', blob, `${view}.jpg`);

        const res = await fetch(`/api/upload/${SESSION_ID}`, {
            method: 'POST',
            body: form,
        });
        const data = await res.json();
        if (data.status === 'ok') {
            lastUploadMessage = '';
            return true;
        } else {
            lastUploadMessage = data.message || 'Ảnh không khớp sản phẩm mẫu';
            return false;
        }
    } catch (e) {
        console.error('Upload error:', e);
        lastUploadMessage = 'Lỗi kết nối máy chủ';
        return false;
    }
}



// ── Frame Analysis & Motion Detection ───────────────────────────────────────

let smoothMotion = 0;

function resetSteadyState() {
    steadyProgress = 0;
    prevGray = null;
    smoothMotion = 0;
    frameBuffer = [];
    bestPeakFrame = null;
    bestPeakScore = -1;
    bestSessionFrame = null;
    lastPeakTime = 0;
    graceHoldStart = 0;
    currentSnapDx = 0;
    currentSnapDy = 0;
    if (targetBox) targetBox.style.transform = 'translate(-50%, -50%)';
    updateTimerBar(0);
}

function toGray(imgData) {
    const d = imgData.data;
    const gray = new Uint8Array(imgData.width * imgData.height);
    for (let i = 0; i < gray.length; i++) {
        const j = i * 4;
        gray[i] = (d[j] * 77 + d[j+1] * 150 + d[j+2] * 29) >> 8;
    }
    return gray;
}

function calcMotion(curr, prev) {
    if (!prev || curr.length !== prev.length) {
        smoothMotion = 999;
        return 999;
    }
    // Vùng trung tâm (20% -> 80% ngang, 15% -> 85% dọc)
    const minX = Math.floor(PROC_W * 0.20);
    const maxX = Math.floor(PROC_W * 0.80);
    const minY = Math.floor(PROC_H * 0.15);
    const maxY = Math.floor(PROC_H * 0.85);

    // 1. Loại trừ độ dịch chuyển độ sáng toàn cục (loại trừ hiện tượng camera tự bù sáng / đèn huỳnh quang nháy)
    let signedSum = 0;
    let sampleCount = 0;
    for (let y = minY; y < maxY; y += 4) {
        const row = y * PROC_W;
        for (let x = minX; x < maxX; x += 4) {
            signedSum += (curr[row + x] - prev[row + x]);
            sampleCount++;
        }
    }
    const meanShift = sampleCount > 0 ? Math.round(signedSum / sampleCount) : 0;

    // 2. Tính độ dịch chuyển thực tế sau khi đã bù sáng toàn cục
    let diffSum = 0;
    let count = 0;
    for (let y = minY; y < maxY; y += 2) {
        const row = y * PROC_W;
        for (let x = minX; x < maxX; x += 2) {
            const diff = Math.abs(curr[row + x] - meanShift - prev[row + x]);
            // Deadband: triệt tiêu hoàn toàn nhiễu hạt cảm biến ISO (<= 3 gray levels)
            const effectiveDiff = diff > 3 ? (diff - 3) : 0;
            diffSum += effectiveDiff;
            count++;
        }
    }
    const raw = count > 0 ? (diffSum / count) : 999;
    if (raw === 999) {
        smoothMotion = 999;
        return 999;
    }
    // Bộ lọc EMA: mượt mà, loại trừ giật frame
    smoothMotion = (smoothMotion === 0 || smoothMotion === 999) ? raw : (smoothMotion * 0.60 + raw * 0.40);
    return smoothMotion;
}

function calcOpticalCenterSharpness() {
    if (!video || !video.videoWidth) return 0.0;
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    // Crop vùng trung tâm 45% (nơi bình gốm hiển thị để kiểm tra độ nét thực tế của bình)
    const cw = Math.round(vw * 0.45);
    const ch = Math.round(vh * 0.45);
    const cx = Math.round((vw - cw) / 2);
    const cy = Math.round((vh - ch) / 2);

    const sCtx = sharpCanvas.getContext('2d', { willReadFrequently: true });
    sCtx.drawImage(video, cx, cy, cw, ch, 0, 0, 240, 240);
    const imgData = sCtx.getImageData(0, 0, 240, 240);
    const d = imgData.data;

    const gray = new Uint8Array(240 * 240);
    for (let i = 0; i < 240 * 240; i++) {
        const j = i * 4;
        gray[i] = (d[j] * 77 + d[j+1] * 150 + d[j+2] * 29) >> 8;
    }

    let sumSq = 0;
    let count = 0;
    const W = 240;
    for (let y = 2; y < 238; y += 2) {
        const row = y * W;
        for (let x = 2; x < 238; x += 2) {
            const idx = row + x;
            const lap = gray[idx] * 4 - gray[idx - 1] - gray[idx + 1] - gray[idx - W] - gray[idx + W];
            sumSq += lap * lap;
            count++;
        }
    }
    if (count === 0) return 0.0;
    const variance = sumSq / count;
    // Ảnh mờ nhòe thực tế chỉ có variance = 24.8.
    // Dưới 250 là chưa lấy nét rõ hoặc đang bị rung nhòe.
    if (variance < 250) return 0.0;
    return Math.min(1.0, (variance - 250) / 1600);
}

function calcFullGlare(imgData) {
    const d = imgData.data;
    let glarePixels = 0;
    const total = imgData.width * imgData.height;
    for (let i = 0; i < d.length; i += 16) {
        if (d[i] > 248 && d[i+1] > 248 && d[i+2] > 248) {
            glarePixels++;
        }
    }
    const sampled = total / 4;
    return glarePixels / sampled;
}

// ── Ghost Template Matching (So khớp hình ảnh mẫu) ──────────────────────────

function prepareGhostTemplate() {
    try {
        if (!ghost || !ghost.complete || !ghost.naturalWidth) return;
        const gCtx = ghostCanvas.getContext('2d', { willReadFrequently: true });
        gCtx.clearRect(0, 0, G_SZ, G_SZ);
        gCtx.drawImage(ghost, 0, 0, G_SZ, G_SZ);
        const imgData = gCtx.getImageData(0, 0, G_SZ, G_SZ);
        const d = imgData.data;

        const gray = new Float32Array(G_SZ * G_SZ);
        const alpha = new Uint8Array(G_SZ * G_SZ);
        let alphaCount = 0;
        let sumVal = 0;

        for (let i = 0; i < G_SZ * G_SZ; i++) {
            const j = i * 4;
            alpha[i] = d[j + 3] > 35 ? 1 : 0;
            const g = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
            gray[i] = g;
            if (alpha[i]) {
                alphaCount++;
                sumVal += g;
            }
        }

        if (alphaCount < 50) {
            ghostTemplate = null;
            return;
        }

        const mean = sumVal / alphaCount;
        let sqDiffSum = 0;
        for (let i = 0; i < G_SZ * G_SZ; i++) {
            if (alpha[i]) {
                const diff = gray[i] - mean;
                sqDiffSum += diff * diff;
            }
        }
        const std = Math.sqrt(sqDiffSum / alphaCount) + 1e-4;

        // Sobel gradient magnitude of ghost silhouette & texture
        const mag = new Float32Array(G_SZ * G_SZ);
        let magSqSum = 0;
        for (let y = 1; y < G_SZ - 1; y++) {
            const row = y * G_SZ;
            for (let x = 1; x < G_SZ - 1; x++) {
                const idx = row + x;
                const gx = (alpha[idx + 1] ? gray[idx + 1] : 0) - (alpha[idx - 1] ? gray[idx - 1] : 0);
                const gy = (alpha[idx + G_SZ] ? gray[idx + G_SZ] : 0) - (alpha[idx - G_SZ] ? gray[idx - G_SZ] : 0);
                const m = Math.sqrt(gx * gx + gy * gy);
                mag[idx] = m;
                magSqSum += m * m;
            }
        }

        // Tối ưu hóa: Trích xuất danh sách pixel vật thể để tính toán cực nhanh trong RAM
        const activeX = new Int16Array(alphaCount);
        const activeY = new Int16Array(alphaCount);
        const activeGray = new Float32Array(alphaCount);
        const activeMag = new Float32Array(alphaCount);
        let ptr = 0;

        const tHist = new Float32Array(32);
        let tSatSum = 0;
        let tSatCount = 0;
        let sumR = 0, sumG = 0, sumB = 0;

        for (let y = 0; y < G_SZ; y++) {
            const row = y * G_SZ;
            for (let x = 0; x < G_SZ; x++) {
                const idx = row + x;
                if (alpha[idx]) {
                    activeX[ptr] = x;
                    activeY[ptr] = y;
                    activeGray[ptr] = gray[idx];
                    activeMag[ptr] = mag[idx];

                    const j = idx * 4;
                    const r = d[j], g = d[j + 1], b = d[j + 2];
                    sumR += r;
                    sumG += g;
                    sumB += b;

                    const bin = Math.min(31, Math.floor(gray[idx] / 8));
                    tHist[bin]++;

                    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
                    const sat = mx > 10 ? (mx - mn) / mx : 0;
                    tSatSum += sat;
                    if (sat > 0.15) tSatCount++;

                    ptr++;
                }
            }
        }

        let tHistNorm = 0;
        for (let b = 0; b < 32; b++) tHistNorm += tHist[b] * tHist[b];
        tHistNorm = Math.sqrt(tHistNorm) + 1e-6;
        for (let b = 0; b < 32; b++) tHist[b] /= tHistNorm;

        const tMeanSat = tSatSum / alphaCount;
        const tSatRatio = tSatCount / alphaCount;
        const tTotalRGB = (sumR + sumG + sumB) + 1e-6;
        const tChromaR = sumR / tTotalRGB;
        const tChromaG = sumG / tTotalRGB;
        const tChromaB = sumB / tTotalRGB;

        ghostTemplate = {
            gray,
            alpha,
            alphaCount,
            mean,
            std,
            mag,
            normMag: Math.sqrt(magSqSum) + 1e-4,
            activeX,
            activeY,
            activeGray,
            activeMag,
            tHist,
            tMeanSat,
            tSatRatio,
            tChromaR,
            tChromaG,
            tChromaB
        };
        console.log(`[Ghost] Template nạp thành công: ${alphaCount} pixels (SatRatio: ${Math.round(tSatRatio*100)}%, Chroma: ${Math.round(tChromaR*100)}/${Math.round(tChromaG*100)}/${Math.round(tChromaB*100)})`);
    } catch (e) {
        console.warn('Lỗi prepareGhostTemplate:', e);
        ghostTemplate = null;
    }
}

// ── Auto-Snap Ghost Matching (Tự động trượt bắt đỉnh trong vùng đệm +-12px) ──

function calcGhostMatch() {
    if (!ghostTemplate || !video || !video.videoWidth) {
        currentSnapDx = 0;
        currentSnapDy = 0;
        if (targetBox) targetBox.style.transform = 'translate(-50%, -50%)';
        return 0.0;
    }

    const compCtx = compCanvas.getContext('2d', { willReadFrequently: true });
    const vw = video.videoWidth;
    const vh = video.videoHeight;

    // Vùng crop từ camera: mở rộng theo tỉ lệ đệm (B_SZ / G_SZ = 88 / 64 = 1.375)
    const baseW = Math.round(vw * 0.70);
    const baseH = Math.round(vh * 0.66);
    const expandRatio = B_SZ / G_SZ;
    const cropW = Math.min(vw, Math.round(baseW * expandRatio));
    const cropH = Math.min(vh, Math.round(baseH * expandRatio));
    const cropX = Math.max(0, Math.round((vw - cropW) / 2));
    const cropY = Math.max(0, Math.round((vh - cropH) / 2));

    compCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, B_SZ, B_SZ);
    const imgData = compCtx.getImageData(0, 0, B_SZ, B_SZ);
    const d = imgData.data;

    // 1. Chuyển toàn bộ buffer B_SZ x B_SZ sang mảng độ xám Float32
    const bGray = new Float32Array(B_SZ * B_SZ);
    for (let i = 0; i < B_SZ * B_SZ; i++) {
        const j = i * 4;
        bGray[i] = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
    }

    // 2. Tính Sobel Gradient một lần duy nhất cho toàn bộ buffer trong RAM
    const bMag = new Float32Array(B_SZ * B_SZ);
    for (let y = 1; y < B_SZ - 1; y++) {
        const row = y * B_SZ;
        for (let x = 1; x < B_SZ - 1; x++) {
            const idx = row + x;
            const gx = bGray[idx + 1] - bGray[idx - 1];
            const gy = bGray[idx + B_SZ] - bGray[idx - B_SZ];
            bMag[idx] = Math.sqrt(gx * gx + gy * gy);
        }
    }

    const alphaCount = ghostTemplate.alphaCount;
    const activeX = ghostTemplate.activeX;
    const activeY = ghostTemplate.activeY;
    const activeGray = ghostTemplate.activeGray;
    const activeMag = ghostTemplate.activeMag;
    const gMean = ghostTemplate.mean;
    const gStd = ghostTemplate.std;
    const gNormMag = ghostTemplate.normMag;
    const tHist = ghostTemplate.tHist;
    const tMeanSat = ghostTemplate.tMeanSat;
    const tSatRatio = ghostTemplate.tSatRatio;
    const tChromaR = ghostTemplate.tChromaR;
    const tChromaG = ghostTemplate.tChromaG;
    const tChromaB = ghostTemplate.tChromaB;

    // 3. Hàm lượng giá nhanh độ khớp tại tọa độ dịch chuyển (dx, dy)
    function evalCandidate(dx, dy) {
        const ox = MAX_SNAP_OFFSET + dx;
        const oy = MAX_SNAP_OFFSET + dy;

        let dotMag = 0;
        let bMagSq = 0;
        let cSum = 0;

        for (let k = 0; k < alphaCount; k++) {
            const bx = activeX[k] + ox;
            const by = activeY[k] + oy;
            const bIdx = by * B_SZ + bx;
            const cm = bMag[bIdx];
            const cg = bGray[bIdx];

            dotMag += cm * activeMag[k];
            bMagSq += cm * cm;
            cSum += cg;
        }

        const edgeCorr = Math.max(0, dotMag / ((Math.sqrt(bMagSq) + 1e-4) * gNormMag));

        const cMean = cSum / alphaCount;
        let cSqDiff = 0;
        let crossDiff = 0;
        for (let k = 0; k < alphaCount; k++) {
            const bx = activeX[k] + ox;
            const by = activeY[k] + oy;
            const bIdx = by * B_SZ + bx;
            const cd = bGray[bIdx] - cMean;
            const gd = activeGray[k] - gMean;
            cSqDiff += cd * cd;
            crossDiff += cd * gd;
        }
        const cStd = Math.sqrt(cSqDiff / alphaCount) + 1e-4;
        const ncc = Math.max(0, crossDiff / (alphaCount * cStd * gStd));

        return {
            edge: edgeCorr,
            ncc: ncc,
            coarseScore: Math.min(1.0, 0.55 * edgeCorr + 0.45 * ncc)
        };
    }

    // 4. Tìm kiếm 2 tầng (Coarse-to-Fine Search) cực nhanh trong ~1.5ms
    let bestCoarseScore = -1;
    let bestDx = 0;
    let bestDy = 0;
    let bestEdge = 0;
    let bestNcc = 0;

    const coarseOffsets = [-12, -9, -6, -3, 0, 3, 6, 9, 12];
    for (let i = 0; i < coarseOffsets.length; i++) {
        const dy = coarseOffsets[i];
        for (let j = 0; j < coarseOffsets.length; j++) {
            const dx = coarseOffsets[j];
            const res = evalCandidate(dx, dy);
            if (res.coarseScore > bestCoarseScore) {
                bestCoarseScore = res.coarseScore;
                bestDx = dx;
                bestDy = dy;
                bestEdge = res.edge;
                bestNcc = res.ncc;
            }
        }
    }

    // Tầng 2: Tinh chỉnh cục bộ bước nhảy 1px xung quanh vị trí đỉnh tìm được
    const fineOffsets = [-1, 0, 1];
    for (let fi = 0; fi < fineOffsets.length; fi++) {
        const dy = Math.max(-MAX_SNAP_OFFSET, Math.min(MAX_SNAP_OFFSET, bestDy + fineOffsets[fi]));
        for (let fj = 0; fj < fineOffsets.length; fj++) {
            const dx = Math.max(-MAX_SNAP_OFFSET, Math.min(MAX_SNAP_OFFSET, bestDx + fineOffsets[fj]));
            if (dx === bestDx && dy === bestDy) continue;
            const res = evalCandidate(dx, dy);
            if (res.coarseScore > bestCoarseScore) {
                bestCoarseScore = res.coarseScore;
                bestDx = dx;
                bestDy = dy;
                bestEdge = res.edge;
                bestNcc = res.ncc;
            }
        }
    }

    // 5. KIỂM ĐỊNH MÀU SẮC & PHÂN BỔ ÁNH SÁNG TẠI ĐỈNH (ANTI-FAKE / ANTI-KEYBOARD GATE)
    const ox = MAX_SNAP_OFFSET + bestDx;
    const oy = MAX_SNAP_OFFSET + bestDy;

    const cHist = new Float32Array(32);
    let cSumR = 0, cSumG = 0, cSumB = 0;
    let cSatSum = 0, cSatCount = 0;

    for (let k = 0; k < alphaCount; k++) {
        const bx = activeX[k] + ox;
        const by = activeY[k] + oy;
        const bIdx = by * B_SZ + bx;
        const cg = bGray[bIdx];
        const bin = Math.min(31, Math.floor(cg / 8));
        cHist[bin]++;

        const pIdx = bIdx * 4;
        const r = d[pIdx], g = d[pIdx + 1], b = d[pIdx + 2];
        cSumR += r;
        cSumG += g;
        cSumB += b;
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        const sat = mx > 10 ? (mx - mn) / mx : 0;
        cSatSum += sat;
        if (sat > 0.15) cSatCount++;
    }

    // Độ tương quan histogram cường độ ánh sáng
    let cHistNorm = 0;
    for (let b = 0; b < 32; b++) cHistNorm += cHist[b] * cHist[b];
    cHistNorm = Math.sqrt(cHistNorm) + 1e-6;
    let histDot = 0;
    for (let b = 0; b < 32; b++) histDot += (cHist[b] / cHistNorm) * tHist[b];
    const histCorr = Math.max(0, histDot);

    // Độ bão hòa & sắc tố màu (Color/Chroma Matching)
    const cMeanSat = cSatSum / alphaCount;
    const cSatRatio = cSatCount / alphaCount;
    const cTotalRGB = (cSumR + cSumG + cSumB) + 1e-6;
    const cChromaR = cSumR / cTotalRGB;
    const cChromaG = cSumG / cTotalRGB;
    const cChromaB = cSumB / cTotalRGB;

    const dr = cChromaR - tChromaR;
    const dg = cChromaG - tChromaG;
    const db = cChromaB - tChromaB;
    const chromaDist = Math.sqrt(dr * dr + dg * dg + db * db);

    let colorFactor = 1.0;
    if (tSatRatio >= 0.30) {
        // Ảnh mẫu có màu sắc rõ rệt, nhưng vật thể camera lại đơn sắc đen/xám (bàn phím, bàn làm việc, tường xám)
        if (cSatRatio < 0.12) {
            colorFactor = Math.max(0.05, (cSatRatio / 0.12) * 0.25);
        } else {
            const satDiff = Math.abs(cMeanSat - tMeanSat);
            colorFactor = Math.max(0.4, 1.0 - satDiff * 1.2);
        }
    }
    if (chromaDist > 0.14) {
        const chromaFactor = Math.max(0.3, 1.0 - Math.pow((chromaDist - 0.14) / 0.25, 2));
        colorFactor *= chromaFactor;
    }

    const baseScore = 0.35 * bestEdge + 0.35 * bestNcc + 0.30 * histCorr;
    const finalScore = Math.min(1.0, Math.max(0.0, baseScore * colorFactor));

    currentSnapDx = bestDx;
    currentSnapDy = bestDy;

    // 6. Hiệu ứng Khóa mục tiêu (Magnetic Snap UI): Dịch chuyển khung ngắm bám theo bình
    if (targetBox) {
        if (finalScore >= 0.38) {
            const shiftX = Math.round((bestDx / MAX_SNAP_OFFSET) * 22);
            const shiftY = Math.round((bestDy / MAX_SNAP_OFFSET) * 22);
            targetBox.style.transform = `translate(calc(-50% + ${shiftX}px), calc(-50% + ${shiftY}px))`;
        } else {
            targetBox.style.transform = 'translate(-50%, -50%)';
        }
    }

    return finalScore;
}

// ── Duplicate Detection ─────────────────────────────────────────────────────

function createThumbnail() {
    const ctx = thumbCanvas.getContext('2d');
    if (video && video.videoWidth > 0) {
        ctx.drawImage(video, 0, 0, 32, 32);
        return new Uint8Array(ctx.getImageData(0, 0, 32, 32).data);
    }
    return new Uint8Array(32 * 32 * 4);
}

function isDuplicate(thumbData) {
    if (!thumbData || thumbData.length === 0) return false;
    if (capturedThumbs.length === 0) return false;

    // Chỉ so sánh với THUMBNAIL GẦN NHẤT (không tích luỹ qua nhiều mặt)
    // Ngưỡng 0.97 — chỉ block nếu gần như giống hệt nhau (cùng góc, cùng khung hình)
    // Bình xoay 90° sẽ khác đủ để pass
    const prev = capturedThumbs[capturedThumbs.length - 1];
    const threshold = CFG.duplicate_threshold || 0.97;

    let diffSum = 0;
    const pixels = 32 * 32;
    for (let i = 0; i < pixels; i++) {
        const j = i * 4;
        const dr = Math.abs(thumbData[j]   - prev[j]);
        const dg = Math.abs(thumbData[j+1] - prev[j+1]);
        const db = Math.abs(thumbData[j+2] - prev[j+2]);
        diffSum += (dr + dg + db) / 3;
    }
    const similarity = 1 - (diffSum / pixels / 255);
    return similarity > threshold;
}

// ── Helpers ─────────────────────────────────────────────────────────────────

function setGuide(text, quality) {
    guideText.textContent = text;
}

function dataUrlToBlob(dataUrl) {
    const parts = dataUrl.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const b64 = atob(parts[1]);
    const arr = new Uint8Array(b64.length);
    for (let i = 0; i < b64.length; i++) arr[i] = b64.charCodeAt(i);
    return new Blob([arr], { type: mime });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Boot ────────────────────────────────────────────────────────────────────
initDots();
viewTitle.textContent = VIEW_LABELS[VIEWS[0]];
loadGhost();
startCamera();
