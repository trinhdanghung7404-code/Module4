spring.application.name=backend

#DB
spring.datasource.url=jdbc:postgresql://localhost:5432/shop_management_db
spring.datasource.username=postgres
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

#photo
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}

# CORS - danh sach origin duoc phep goi API (viet khong dau de tranh loi ma hoa file .properties)
# 5173 = admin-frontend, 5174 = client-frontend (Vite tu nhay cong khi 5173 dang bi chiem)
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# So ngay mot token dang nhap cua khach con dung duoc (SessionService).
# Ngan = an toan hon khi token ro; dai = khach phai dang nhap lai li. 30 la muc thuong cua shop nho.
app.user.session-ttl-days=30

# So GIO mot token dang nhap cua quan tri con dung duoc (AdminSessionService).
# Ngan hon khach rat nhieu co chu dich: token khach roi vao tay ke khac thi lo so
# dia chi cua mot nguoi; token admin roi thi xoa duoc san pham, doi duoc don hang
# cua ca cua hang. 12 gio = mot ca lam viec, het ca phai dang nhap lai.
app.admin.session-ttl-hours=12

cloudinary.api-secret=${CLOUDINARY_API_SECRET}